name: Integration CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Throwaway credentials for the ephemeral CI database only; not a secret.
  ConnectionStrings__FieldOpsDatabase: Host=localhost;Port=5432;Database=fieldops_ci;Username=fieldops_ci;Password=fieldops_ci

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fieldops_ci
          POSTGRES_USER: fieldops_ci
          POSTGRES_PASSWORD: fieldops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldops_ci -d fieldops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # No packages.lock.json exists, so setup-dotnet's built-in cache cannot be used.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore FieldOps.slnx

      - name: Build
        run: dotnet build FieldOps.slnx --configuration Release --no-restore

      - name: Apply EF Core migrations
        run: >-
          dotnet ef database update
          --project src/FieldOps.Infrastructure/FieldOps.Infrastructure.csproj
          --startup-project src/FieldOps.Api/FieldOps.Api.csproj
          --configuration Release
          --no-build

      - name: Integration tests
        run: >-
          dotnet test tests/FieldOps.IntegrationTests/FieldOps.IntegrationTests.csproj
          --configuration Release --no-build
