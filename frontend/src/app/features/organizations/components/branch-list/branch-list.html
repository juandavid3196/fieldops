<section class="branch-list" id="branches" aria-labelledby="branch-list-heading">
  <div class="branch-list__header">
    <h2 id="branch-list-heading">Branches</h2>
    <span class="branch-list__count">{{ branches().length }} branches</span>
    <span class="branch-list__spacer"></span>
    @if (canManage()) {
      <button pButton type="button" class="branch-list__add" (click)="addBranch.emit()">
        <i class="pi pi-plus" aria-hidden="true"></i>
        Add branch
      </button>
    }
  </div>

  <div class="branch-list__controls">
    <p-iconfield class="branch-list__search-field">
      <p-inputicon class="pi pi-search" />
      <input
        pInputText
        type="search"
        class="branch-list__search"
        placeholder="Search branches…"
        aria-label="Search branches"
        fluid
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </p-iconfield>
    <p-select
      class="branch-list__status-filter"
      ariaLabel="Filter by status"
      appendTo="body"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="code"
      [ngModel]="statusFilter()"
      (ngModelChange)="statusFilter.set($event)"
    />
  </div>

  @if (loadError()) {
    <div class="branch-list__load-error" role="alert">
      <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
      <span class="branch-list__load-error-text">{{ loadErrorMessage }}</span>
      <button pButton type="button" severity="secondary" [outlined]="true" (click)="retry.emit()">
        <i class="pi pi-refresh" aria-hidden="true"></i>
        Retry
      </button>
    </div>
  } @else if (loading()) {
    <div class="branch-list__skeletons" aria-busy="true">
      <p-skeleton height="2.75rem" />
      <p-skeleton height="2.75rem" />
      <p-skeleton height="2.75rem" />
    </div>
  } @else if (branches().length === 0) {
    <p class="branch-list__empty">No branches to show.</p>
  } @else if (filtered().length === 0) {
    <div class="branch-list__empty">
      <p>No branches match these filters.</p>
      <button pButton type="button" severity="secondary" (click)="clearFilters()">
        Clear filters
      </button>
    </div>
  } @else {
    <app-branch-table
      [rows]="filtered()"
      [sortDirection]="sortDirection()"
      [selectedId]="selectedId()"
      (sortToggled)="toggleSort()"
      (rowActivated)="onRowActivate($event)"
      (menuRequested)="openMenu($event.event, $event.branch)"
    />
  }

  <p-menu #menu [popup]="true" appendTo="body" [model]="menuModel()" />
</section>
