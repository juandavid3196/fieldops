<section
  class="profile-card"
  id="company-profile"
  aria-labelledby="company-profile-heading"
  [formGroup]="group()"
>
  <h2 id="company-profile-heading">Company profile</h2>

  <app-logo-control
    class="profile-card__logo"
    [logo]="logo()"
    [displayName]="displayName()"
    [canManage]="canManage()"
    (unauthorized)="unauthorized.emit()"
  />

  <div class="profile-card__grid">
    <app-form-field
      label="Legal business name"
      controlId="organization-legalName"
      [required]="true"
      [error]="error('organization.legalName')"
    >
      <input
        pInputText
        id="organization-legalName"
        formControlName="legalName"
        fluid
        [invalid]="error('organization.legalName') !== null"
        [readonly]="submitting()"
        aria-required="true"
        [attr.aria-invalid]="error('organization.legalName') !== null ? 'true' : null"
        [attr.aria-describedby]="describedBy('organization.legalName', 'organization-legalName')"
        (blur)="fieldBlur.emit('organization.legalName')"
      />
    </app-form-field>

    <app-form-field
      label="Display name"
      controlId="organization-name"
      [required]="true"
      [error]="error('organization.name')"
    >
      <input
        pInputText
        id="organization-name"
        formControlName="name"
        fluid
        [invalid]="error('organization.name') !== null"
        [readonly]="submitting()"
        aria-required="true"
        [attr.aria-invalid]="error('organization.name') !== null ? 'true' : null"
        [attr.aria-describedby]="describedBy('organization.name', 'organization-name')"
        (blur)="fieldBlur.emit('organization.name')"
      />
    </app-form-field>

    <app-form-field
      label="Website"
      controlId="organization-website"
      [error]="error('organization.website')"
    >
      <input
        pInputText
        id="organization-website"
        type="url"
        formControlName="website"
        fluid
        [invalid]="error('organization.website') !== null"
        [readonly]="submitting()"
        [attr.aria-invalid]="error('organization.website') !== null ? 'true' : null"
        [attr.aria-describedby]="describedBy('organization.website', 'organization-website')"
        (blur)="fieldBlur.emit('organization.website')"
      />
    </app-form-field>

    <app-form-field
      label="Business email"
      controlId="organization-email"
      [required]="true"
      [error]="error('organization.email')"
    >
      <input
        pInputText
        id="organization-email"
        type="email"
        formControlName="email"
        fluid
        [invalid]="error('organization.email') !== null"
        [readonly]="submitting()"
        aria-required="true"
        [attr.aria-invalid]="error('organization.email') !== null ? 'true' : null"
        [attr.aria-describedby]="describedBy('organization.email', 'organization-email')"
        (blur)="fieldBlur.emit('organization.email')"
      />
    </app-form-field>

    <app-form-field
      label="Phone number"
      controlId="organization-phone"
      [required]="true"
      [error]="error('organization.phone')"
    >
      <input
        pInputText
        id="organization-phone"
        type="tel"
        formControlName="phone"
        fluid
        [invalid]="error('organization.phone') !== null"
        [readonly]="submitting()"
        aria-required="true"
        [attr.aria-invalid]="error('organization.phone') !== null ? 'true' : null"
        [attr.aria-describedby]="describedBy('organization.phone', 'organization-phone')"
        (blur)="fieldBlur.emit('organization.phone')"
      />
    </app-form-field>

    <app-form-field
      label="Tax ID (EIN)"
      controlId="organization-taxId"
      [error]="error('organization.taxId')"
    >
      <input
        pInputText
        id="organization-taxId"
        formControlName="taxId"
        fluid
        [invalid]="error('organization.taxId') !== null"
        [readonly]="submitting()"
        [attr.aria-invalid]="error('organization.taxId') !== null ? 'true' : null"
        [attr.aria-describedby]="describedBy('organization.taxId', 'organization-taxId')"
        (blur)="fieldBlur.emit('organization.taxId')"
      />
    </app-form-field>
  </div>

  <div class="profile-card__grid profile-card__grid--second">
    <div class="profile-card__address" role="group" aria-labelledby="company-address-label">
      <span class="profile-card__label" id="company-address-label">
        Company address <span class="profile-card__required" aria-hidden="true">*</span>
      </span>
      <div class="profile-card__address-row">
        <input
          pInputText
          id="organization-addressLine1"
          formControlName="addressLine1"
          aria-label="Street address"
          placeholder="Street address"
          fluid
          [invalid]="error('organization.addressLine1') !== null"
          [readonly]="submitting()"
          aria-required="true"
          [attr.aria-invalid]="error('organization.addressLine1') !== null ? 'true' : null"
          [attr.aria-describedby]="
            describedBy('organization.addressLine1', 'organization-addressLine1')
          "
          (blur)="fieldBlur.emit('organization.addressLine1')"
        />
        <input
          pInputText
          id="organization-city"
          formControlName="city"
          aria-label="City"
          placeholder="City"
          fluid
          [invalid]="error('organization.city') !== null"
          [readonly]="submitting()"
          aria-required="true"
          [attr.aria-invalid]="error('organization.city') !== null ? 'true' : null"
          [attr.aria-describedby]="describedBy('organization.city', 'organization-city')"
          (blur)="fieldBlur.emit('organization.city')"
        />
        @if (usesStateList()) {
          <p-select
            inputId="organization-stateRegion"
            formControlName="stateRegion"
            [options]="stateOptions"
            optionLabel="label"
            optionValue="code"
            [filter]="true"
            ariaLabel="State"
            placeholder="State"
            appendTo="body"
            fluid
            [invalid]="error('organization.stateRegion') !== null"
            [readonly]="submitting()"
            [attr.aria-invalid]="error('organization.stateRegion') !== null ? 'true' : null"
            [attr.aria-describedby]="
              describedBy('organization.stateRegion', 'organization-stateRegion')
            "
            (onBlur)="fieldBlur.emit('organization.stateRegion')"
          >
            <ng-template #selectedItem let-option>{{ option.code }}</ng-template>
          </p-select>
        } @else {
          <input
            pInputText
            id="organization-stateRegion"
            formControlName="stateRegion"
            aria-label="State"
            placeholder="State / region"
            fluid
            [invalid]="error('organization.stateRegion') !== null"
            [readonly]="submitting()"
            [attr.aria-invalid]="error('organization.stateRegion') !== null ? 'true' : null"
            [attr.aria-describedby]="
              describedBy('organization.stateRegion', 'organization-stateRegion')
            "
            (blur)="fieldBlur.emit('organization.stateRegion')"
          />
        }
        <input
          pInputText
          id="organization-postalCode"
          formControlName="postalCode"
          aria-label="ZIP code"
          placeholder="ZIP code"
          fluid
          [invalid]="error('organization.postalCode') !== null"
          [readonly]="submitting()"
          aria-required="true"
          [attr.aria-invalid]="error('organization.postalCode') !== null ? 'true' : null"
          [attr.aria-describedby]="
            describedBy('organization.postalCode', 'organization-postalCode')
          "
          (blur)="fieldBlur.emit('organization.postalCode')"
        />
      </div>
      @for (field of addressFields; track field.key) {
        @if (error(field.key); as message) {
          <p class="profile-card__error" [id]="field.id + '-error'">
            <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
            {{ field.label }}: {{ message }}
          </p>
        }
      }
    </div>

    <app-form-field
      label="Default country"
      controlId="organization-countryCode"
      [required]="true"
      [error]="error('organization.countryCode')"
    >
      <p-select
        inputId="organization-countryCode"
        formControlName="countryCode"
        [options]="countryOptions()"
        optionLabel="label"
        optionValue="code"
        [filter]="true"
        ariaLabel="Default country"
        placeholder="Select a country"
        appendTo="body"
        fluid
        [invalid]="error('organization.countryCode') !== null"
        [readonly]="submitting()"
        aria-required="true"
        [attr.aria-invalid]="error('organization.countryCode') !== null ? 'true' : null"
        [attr.aria-describedby]="
          describedBy('organization.countryCode', 'organization-countryCode')
        "
        (onBlur)="fieldBlur.emit('organization.countryCode')"
      />
    </app-form-field>

    <app-form-field
      label="Default time zone"
      controlId="organization-timezone"
      [required]="true"
      [error]="error('organization.timezone')"
    >
      <p-select
        inputId="organization-timezone"
        formControlName="timezone"
        [options]="timezoneOptions()"
        optionLabel="label"
        optionValue="code"
        [filter]="true"
        ariaLabel="Default time zone"
        appendTo="body"
        fluid
        [invalid]="error('organization.timezone') !== null"
        [readonly]="submitting()"
        aria-required="true"
        [attr.aria-invalid]="error('organization.timezone') !== null ? 'true' : null"
        [attr.aria-describedby]="describedBy('organization.timezone', 'organization-timezone')"
        (onBlur)="fieldBlur.emit('organization.timezone')"
      >
        <!-- The list shows "(UTC±hh:mm) Name — IANA id"; the closed control drops the id so it fits. -->
        <ng-template #selectedItem let-option>{{ option.label.split(' — ')[0] }}</ng-template>
      </p-select>
    </app-form-field>
  </div>
</section>
