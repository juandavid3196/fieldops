<app-wizard-card
  headingId="taxes-currency-heading"
  title="Taxes & currency"
  description="Choose your currency and default tax rate. These settings will be used on new quotes and invoices."
  icon="pi-wallet"
>
  <div class="taxes-currency__grid" [formGroup]="group()">
    <app-form-field
      label="Currency"
      controlId="organization-currency"
      [required]="true"
      [error]="error('organization.currency')"
    >
      <p-select
        inputId="organization-currency"
        appendTo="body"
        formControlName="currency"
        [options]="currencyOptions()"
        optionLabel="label"
        optionValue="code"
        [filter]="true"
        ariaLabel="Currency"
        fluid
        [invalid]="error('organization.currency') !== null"
        [readonly]="submitting()"
        aria-required="true"
        [attr.aria-invalid]="error('organization.currency') !== null ? 'true' : null"
        [attr.aria-describedby]="
          error('organization.currency') !== null ? 'organization-currency-error' : null
        "
        (onBlur)="fieldBlur.emit('organization.currency')"
      />
    </app-form-field>

    <app-form-field
      label="Default tax rate"
      controlId="organization-defaultTaxRate"
      [required]="true"
      [error]="error('organization.defaultTaxRate')"
    >
      <p-inputnumber
        inputId="organization-defaultTaxRate"
        formControlName="defaultTaxRate"
        mode="decimal"
        suffix=" %"
        [min]="0"
        [max]="100"
        [maxFractionDigits]="4"
        fluid
        [invalid]="error('organization.defaultTaxRate') !== null"
        [readonly]="submitting()"
        [ariaLabel]="'Default tax rate'"
        aria-required="true"
        [attr.aria-invalid]="error('organization.defaultTaxRate') !== null ? 'true' : null"
        [attr.aria-describedby]="
          error('organization.defaultTaxRate') !== null ? 'organization-defaultTaxRate-error' : null
        "
        (onBlur)="fieldBlur.emit('organization.defaultTaxRate')"
      />
    </app-form-field>

    <app-wizard-note>
      The selected currency will be used on new quotes and invoices. You can change this later in
      your settings.
    </app-wizard-note>
  </div>
</app-wizard-card>
