<form
  class="filters"
  ngNoForm
  role="search"
  [attr.aria-label]="'reports.reportFilters.reportFilters' | transloco"
  (submit)="$event.preventDefault(); applied.emit()"
>
  @for (field of fields(); track field.key) {
    <div class="filters__field">
      <span [id]="'report-filter-' + field.key">{{ field.label }}</span>
      <p-select
        appendTo="body"
        fluid
        optionLabel="label"
        optionValue="code"
        [ariaLabelledBy]="'report-filter-' + field.key"
        [disabled]="disabled()"
        [options]="field.options | localizedRef"
        [ngModel]="values()[field.key] ?? 'all'"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="changed.emit({ key: field.key, code: $event })"
      />
    </div>
  }
  <div class="filters__buttons">
    <button pButton type="submit" [disabled]="disabled()">
      {{ 'reports.reportFilters.applyFilters' | transloco }}
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      [disabled]="disabled()"
      (click)="resetRequested.emit()"
    >
      {{ 'common.reset' | transloco }}
    </button>
  </div>
</form>
