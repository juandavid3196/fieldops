<p-dialog
  [header]="'quotes.quoteResendDialog.resendEmail' | transloco"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!submitting()"
  [closeOnEscape]="!submitting()"
  [visible]="open()"
  (visibleChange)="$event ? null : dismissed.emit()"
  [style]="{ width: '30rem', maxWidth: '94vw' }"
>
  <form class="resend" ngNoForm novalidate (submit)="$event.preventDefault(); submit()">
    <p class="resend__text">
      {{ 'quotes.quoteResendDialog.aNewSecureLink' | transloco: { recipient: recipient() } }}
    </p>
    <app-form-field
      [label]="'quotes.quoteResendDialog.message' | transloco"
      controlId="quote-resend-message"
      [required]="true"
      [error]="error()"
    >
      <textarea
        pTextarea
        id="quote-resend-message"
        rows="4"
        fluid
        name="message"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="error() ? 'quote-resend-message-error' : null"
        [ngModel]="message()"
        (ngModelChange)="message.set($event)"
      ></textarea>
    </app-form-field>
    <p class="resend__count">{{ message().length }}/{{ limit }}</p>
  </form>

  <ng-template #footer>
    <button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      [disabled]="submitting()"
      (click)="dismissed.emit()"
    >
      {{ 'common.cancel' | transloco }}
    </button>
    <button pButton type="button" [disabled]="submitting()" (click)="submit()">
      @if (submitting()) {
        <svg data-p-icon="spinner" [spin]="true" aria-hidden="true"></svg>
      }
      {{ 'quotes.quoteResendDialog.resendEmail' | transloco }}
    </button>
  </ng-template>
</p-dialog>
