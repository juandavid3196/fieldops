<p-dialog
  [header]="copy().header"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!submitting()"
  [closeOnEscape]="!submitting()"
  [visible]="open()"
  (visibleChange)="$event ? null : dismissed.emit()"
  [style]="{ width: '30rem', maxWidth: '94vw' }"
>
  <form class="dialog" ngNoForm novalidate (submit)="$event.preventDefault(); submit()">
    <p class="dialog__text">
      @if (kind() === 'decline') {
        Let {{ organizationName() }} know why you're declining. This can't be undone.
      } @else {
        {{ organizationName() }} will contact you by phone or email.
      }
    </p>
    <app-form-field
      [label]="copy().label"
      controlId="public-quote-text"
      [required]="true"
      [error]="error()"
    >
      <textarea
        #field
        pTextarea
        id="public-quote-text"
        rows="4"
        fluid
        name="text"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="error() ? 'public-quote-text-error' : null"
        [ngModel]="text()"
        (ngModelChange)="text.set($event)"
      ></textarea>
    </app-form-field>
    <p class="dialog__count">{{ text().length }}/{{ limit }}</p>
    @if (failure(); as message) {
      <p class="dialog__failure" role="alert">{{ message }}</p>
    }
  </form>

  <ng-template #footer>
    <button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      [disabled]="submitting()"
      (click)="dismissed.emit()"
    >
      Cancel
    </button>
    <button
      pButton
      type="button"
      [severity]="kind() === 'decline' ? 'danger' : undefined"
      [disabled]="submitting()"
      (click)="submit()"
    >
      @if (submitting()) {
        <svg data-p-icon="spinner" [spin]="true" aria-hidden="true"></svg>
      }
      {{ copy().submit }}
    </button>
  </ng-template>
</p-dialog>
