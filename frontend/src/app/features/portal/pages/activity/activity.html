<div class="pp">
  <header class="pp__head">
    <h1 class="pp__title">{{ 'portal.activity.recentActivity' | transloco }}</h1>
    @if (list.properties().length > 0) {
      <app-portal-property-filter
        [properties]="list.properties()"
        [value]="list.propertyId()"
        (changed)="list.filter($event)"
      />
    }
  </header>

  <app-portal-state
    [state]="list.resource.state()"
    [label]="'portal.activity.loadingActivity' | transloco"
    [emptyText]="'portal.activity.noCompletedServicesYet' | transloco"
    [errorText]="'portal.activity.weCouldnTLoad' | transloco"
    (retry)="list.reload()"
  >
    @if (list.resource.data(); as page) {
      <div class="pcard">
        <app-portal-activity-table [rows]="page.items" />
        <app-hub-pager
          [page]="page.page"
          [pageSize]="page.pageSize"
          [total]="page.total"
          [noun]="'portal.activity.services' | transloco"
          (pageChange)="list.goTo($event)"
        />
      </div>
    }
  </app-portal-state>
</div>
