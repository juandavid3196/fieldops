<p-dialog
  header="Send a message"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!submitting()"
  [closeOnEscape]="!submitting()"
  [visible]="visible()"
  (visibleChange)="$event ? null : close()"
  [style]="{ width: '30rem', maxWidth: '94vw' }"
>
  @if (sent()) {
    <div class="dialog__sent" role="status">
      <span class="dialog__sent-icon" aria-hidden="true"><i class="pi pi-check"></i></span>
      <p>{{ sentText() }}</p>
    </div>
  } @else {
    <form class="dialog" ngNoForm novalidate (submit)="$event.preventDefault(); submit()">
      <div class="dialog__to">
        <span class="dialog__to-icon" aria-hidden="true"><i class="pi pi-building"></i></span>
        <div>
          <p class="dialog__to-label">To</p>
          <p class="dialog__to-name">{{ organizationName() }}</p>
          <p class="dialog__to-hint">Replies by email or phone</p>
        </div>
      </div>
      <app-form-field
        label="Message"
        controlId="portal-message-text"
        [required]="true"
        [error]="error()"
      >
        <textarea
          pTextarea
          id="portal-message-text"
          rows="5"
          fluid
          placeholder="How can we help? Include any details about your service, property or schedule."
          name="message"
          [attr.aria-invalid]="error() ? 'true' : null"
          [attr.aria-describedby]="error() ? 'portal-message-text-error' : null"
          [ngModel]="message()"
          (ngModelChange)="message.set($event)"
        ></textarea>
      </app-form-field>
      <p class="dialog__count">{{ message().length }}/{{ limit }}</p>
      <p class="dialog__note">
        <span class="dialog__info" aria-hidden="true"><i class="pi pi-info"></i></span>
        Your name, email and phone are included so they can reply.
      </p>
      @if (failure(); as text) {
        <p class="dialog__failure" role="alert">{{ text }}</p>
      }
    </form>
  }

  <ng-template #footer>
    @if (sent()) {
      <button pButton type="button" (click)="close()">Close</button>
    } @else {
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        class="dialog__cancel"
        [disabled]="submitting()"
        (click)="close()"
      >
        Cancel
      </button>
      <button pButton type="button" [disabled]="submitting()" (click)="submit()">
        @if (submitting()) {
          <svg data-p-icon="spinner" [spin]="true" aria-hidden="true"></svg>
        }
        Send message
        <i class="pi pi-send" aria-hidden="true"></i>
      </button>
    }
  </ng-template>
</p-dialog>
