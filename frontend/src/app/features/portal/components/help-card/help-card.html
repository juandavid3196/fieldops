<section class="pcard" aria-labelledby="help-title">
  <div class="help__head">
    <i class="pi pi-headphones help__icon" aria-hidden="true"></i>
    <div>
      <h2 class="help__title" id="help-title">{{ 'portal.helpCard.needHelp' | transloco }}</h2>
      <p class="help__sub">{{ 'portal.helpCard.weReHereFor' | transloco }}</p>
    </div>
  </div>
  <div class="help__actions">
    @if (phone(); as phone) {
      <a pButton class="help__action" severity="secondary" [outlined]="true" [href]="href(phone)">
        <i class="pi pi-phone help__action-icon" aria-hidden="true"></i>
        <span class="help__action-label">{{
          'portal.helpCard.call' | transloco: { phone: phone }
        }}</span>
      </a>
    }
    @if (canMessage()) {
      <button
        pButton
        type="button"
        class="help__action"
        severity="secondary"
        [outlined]="true"
        (click)="composeMessage.emit()"
      >
        <i class="pi pi-comment help__action-icon" aria-hidden="true"></i>
        <span class="help__action-label">{{ 'portal.helpCard.sendAMessage' | transloco }}</span>
      </button>
    }
  </div>
</section>
