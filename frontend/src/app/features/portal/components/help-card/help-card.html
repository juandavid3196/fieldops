<section class="pcard" aria-labelledby="help-title">
  <div class="help__head">
    <i class="pi pi-headphones help__icon" aria-hidden="true"></i>
    <div>
      <h2 class="help__title" id="help-title">Need help?</h2>
      <p class="help__sub">We're here for you.</p>
    </div>
  </div>
  <div class="help__actions">
    @if (phone(); as phone) {
      <a pButton class="help__action" severity="secondary" [outlined]="true" [href]="href(phone)">
        <i class="pi pi-phone help__action-icon" aria-hidden="true"></i>
        <span class="help__action-label">Call {{ phone }}</span>
      </a>
    }
    @if (canMessage()) {
      <button
        pButton
        type="button"
        class="help__action"
        severity="secondary"
        [outlined]="true"
        (click)="composeMessage.emit()"
      >
        <i class="pi pi-comment help__action-icon" aria-hidden="true"></i>
        <span class="help__action-label">Send a message</span>
      </button>
    }
  </div>
</section>
