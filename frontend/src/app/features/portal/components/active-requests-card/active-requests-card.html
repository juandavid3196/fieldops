<section class="pcard" aria-labelledby="active-requests-title">
  <header class="pcard__head">
    <h2 class="pcard__title" id="active-requests-title">
      <i class="pi pi-file pcard__icon" aria-hidden="true"></i>
      Active requests
    </h2>
    <a class="pcard__link" routerLink="/portal/requests">View all</a>
  </header>
  @if (rows().length === 0) {
    <p class="pcard__empty">No active requests.</p>
  } @else {
    <ul class="plist">
      @for (row of rows(); track row.request.id) {
        <li>
          <div class="plist__main">
            <p class="plist__title">{{ row.request.displayNumber }}</p>
            <p class="plist__sub">{{ row.request.title }}</p>
          </div>
          <app-portal-status-chip [label]="row.chip.label" [tone]="row.chip.tone" />
          <span class="plist__sub">Submitted {{ row.submitted }}</span>
          <a
            pButton
            severity="secondary"
            [outlined]="true"
            size="small"
            [attr.aria-label]="'View request ' + row.request.displayNumber"
            [routerLink]="['/portal/requests', row.request.id]"
            >View</a
          >
        </li>
      }
    </ul>
  }
</section>
