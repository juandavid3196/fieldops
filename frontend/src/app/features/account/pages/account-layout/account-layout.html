<div class="account">
  <nav [attr.aria-label]="'account.accountLayout.breadcrumb' | transloco">
    <ol class="account__breadcrumb">
      <li>{{ 'account.accountLayout.account' | transloco }}</li>
      <li class="account__current" aria-current="page">{{ currentLabel() }}</li>
    </ol>
  </nav>

  <header class="account__header">
    <h1 class="account__title">{{ 'account.accountLayout.accountSettings' | transloco }}</h1>
    <p class="account__subtitle">{{ 'account.accountLayout.manageYourProfileAnd' | transloco }}</p>
  </header>

  <div class="account__body">
    <nav
      class="account__nav"
      [attr.aria-label]="'account.accountLayout.accountSettingsSections' | transloco"
    >
      <ul class="account__nav-list">
        @for (section of sections; track section.link) {
          <li>
            <a
              class="account__nav-link"
              routerLinkActive="account__nav-link--current"
              ariaCurrentWhenActive="page"
              [routerLink]="section.link"
            >
              <i class="pi" [class]="section.icon" aria-hidden="true"></i>
              {{ section.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <section class="account__card">
      <router-outlet />
    </section>
  </div>
</div>
