<nav class="team-tabs" [attr.aria-label]="'team.teamTabs.teamSections' | transloco">
  <a
    class="team-tabs__tab"
    routerLink="/team"
    [class.team-tabs__tab--current]="current() === 'members'"
    [attr.aria-current]="current() === 'members' ? 'page' : null"
  >
    {{ 'team.teamTabs.teamMembers' | transloco: { value: membersCount() ?? '—' } }}
  </a>
  <a
    class="team-tabs__tab"
    routerLink="/team"
    [queryParams]="availabilityQuery"
    [class.team-tabs__tab--current]="current() === 'availability'"
    [attr.aria-current]="current() === 'availability' ? 'page' : null"
  >
    {{ 'team.teamTabs.availability' | transloco }}
  </a>
  <a
    class="team-tabs__tab"
    routerLink="/team"
    [queryParams]="skillsQuery"
    [class.team-tabs__tab--current]="current() === 'skills'"
    [attr.aria-current]="current() === 'skills' ? 'page' : null"
  >
    {{ 'team.teamTabs.skills' | transloco }}
  </a>
  <div class="team-tabs__trailing"><ng-content /></div>
</nav>
