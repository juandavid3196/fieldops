<div class="overview">
  <h1 class="overview__title">{{ heading() }}</h1>

  @if (session(); as current) {
    <dl class="overview__details">
      <div class="overview__detail">
        <dt class="overview__term">{{ 'overview.overview.organization' | transloco }}</dt>
        <dd class="overview__value">{{ current.organization.name }}</dd>
      </div>
      <div class="overview__detail">
        <dt class="overview__term">{{ 'common.role' | transloco }}</dt>
        <dd class="overview__value">
          {{ current.role.name | codeLabel: 'roles' : current.role.code }}
        </dd>
      </div>
    </dl>
  }
</div>
