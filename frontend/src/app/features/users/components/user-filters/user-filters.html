<div
  class="user-filters"
  role="search"
  [attr.aria-label]="'users.userFilters.filterUsers' | transloco"
>
  <p-iconfield class="user-filters__search-field">
    <p-inputicon class="pi pi-search" />
    <input
      pInputText
      type="search"
      class="user-filters__search"
      [attr.placeholder]="'users.userFilters.searchByNameOr' | transloco"
      [attr.aria-label]="'users.userFilters.searchByNameOr2' | transloco"
      fluid
      [ngModel]="searchText()"
      (ngModelChange)="searchTextChange.emit($event)"
    />
  </p-iconfield>

  <div class="user-filters__field">
    <label class="user-filters__label" for="user-filter-role">{{
      'common.role' | transloco
    }}</label>
    <p-select
      inputId="user-filter-role"
      class="user-filters__select"
      appendTo="body"
      fluid
      [options]="roleOptions()"
      optionLabel="label"
      optionValue="code"
      [ngModel]="roleCode()"
      (ngModelChange)="roleChange.emit($event)"
    />
  </div>

  <div class="user-filters__field">
    <label class="user-filters__label" for="user-filter-branch">{{
      'users.userFilters.branchAccess' | transloco
    }}</label>
    <p-select
      inputId="user-filter-branch"
      class="user-filters__select"
      appendTo="body"
      fluid
      [options]="branchOptions()"
      optionLabel="label"
      optionValue="code"
      [ngModel]="branchId()"
      (ngModelChange)="branchChange.emit($event)"
    />
  </div>

  <div class="user-filters__field">
    <label class="user-filters__label" for="user-filter-status">{{
      'users.userFilters.accountStatus' | transloco
    }}</label>
    <p-select
      inputId="user-filter-status"
      class="user-filters__select"
      appendTo="body"
      fluid
      [options]="statusOptions | localizedRef"
      optionLabel="label"
      optionValue="code"
      [ngModel]="status()"
      (ngModelChange)="statusChange.emit($event)"
    />
  </div>

  <button
    pButton
    type="button"
    class="user-filters__clear"
    severity="secondary"
    [text]="true"
    [disabled]="!hasFilters()"
    (click)="cleared.emit()"
  >
    {{ 'users.userFilters.clearFilters' | transloco }}
  </button>
</div>
