<p-dialog
  header="Assessment photo"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  closeAriaLabel="Close"
  [visible]="visible()"
  (visibleChange)="$event ? null : close()"
  [style]="{ width: '30rem', maxWidth: '96vw' }"
>
  @if (photo(); as current) {
    <div class="viewer" tabindex="-1" (keydown)="onKey($event)">
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        aria-label="Previous photo"
        [disabled]="photos().length < 2"
        (click)="step(-1)"
      >
        <i class="pi pi-chevron-left" aria-hidden="true"></i>
      </button>
      @if (unavailable()) {
        <p class="viewer__failed">Photo unavailable.</p>
      } @else {
        <img class="viewer__image" [src]="current.url" [alt]="alt()" (error)="markFailed()" />
      }
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        aria-label="Next photo"
        [disabled]="photos().length < 2"
        (click)="step(1)"
      >
        <i class="pi pi-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  }
</p-dialog>
