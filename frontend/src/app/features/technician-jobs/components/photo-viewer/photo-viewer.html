<p-dialog
  [header]="header()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [closeAriaLabel]="'common.close' | transloco"
  [visible]="visible()"
  (visibleChange)="$event ? null : close()"
  [style]="{ width: '30rem', maxWidth: '96vw' }"
>
  @if (photo(); as current) {
    <div class="viewer" tabindex="-1" (keydown)="onKey($event)">
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        [attr.aria-label]="'technicianJobs.photoViewer.previousPhoto' | transloco"
        [disabled]="photos().length < 2"
        (click)="step(-1)"
      >
        <i class="pi pi-chevron-left" aria-hidden="true"></i>
      </button>
      @if (unavailable()) {
        <p class="viewer__failed">
          {{ 'technicianJobs.photoViewer.photoUnavailable' | transloco }}
        </p>
      } @else {
        <img class="viewer__image" [src]="current.url" [alt]="alt()" (error)="markFailed()" />
      }
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        [attr.aria-label]="'technicianJobs.photoViewer.nextPhoto' | transloco"
        [disabled]="photos().length < 2"
        (click)="step(1)"
      >
        <i class="pi pi-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
    @if (deletable()) {
      <button
        pButton
        type="button"
        class="viewer__delete"
        severity="danger"
        [outlined]="true"
        (click)="deleteRequest.emit({ id: current.id, trigger: $any($event.currentTarget) })"
      >
        <i class="pi pi-trash" aria-hidden="true"></i>
        {{ 'technicianJobs.photoViewer.deletePhoto' | transloco }}
      </button>
    }
  }
</p-dialog>
