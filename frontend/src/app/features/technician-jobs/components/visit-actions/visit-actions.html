<div class="visit-actions" [class.visit-actions--featured]="featured()">
  @if (callHref(); as href) {
    <a
      pButton
      class="visit-actions__button"
      severity="secondary"
      [outlined]="true"
      [href]="href"
      [attr.aria-label]="
        'technicianJobs.visitActions.call' | transloco: { customerName: visit().customerName }
      "
    >
      <i class="pi pi-phone" aria-hidden="true"></i>
      {{ 'technicianJobs.visitActions.call2' | transloco }}
    </a>
  }
  <a
    pButton
    class="visit-actions__button visit-actions__button--directions"
    severity="secondary"
    [outlined]="true"
    target="_blank"
    rel="noopener noreferrer"
    [href]="directionsHref()"
    [attr.aria-label]="
      'technicianJobs.visitActions.toOpensInA'
        | transloco: { directionsLabel: directionsLabelValue(), title: visit().title }
    "
  >
    <i class="pi" [class]="featured() ? 'pi-send' : 'pi-directions'" aria-hidden="true"></i>
    {{ directionsLabelValue() }}
  </a>
</div>
