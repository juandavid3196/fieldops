<div class="shell">
  @if (!isDrawer()) {
    <app-shell-sidebar
      class="shell__sidebar"
      [groups]="groups()"
      [rail]="railActive()"
      (collapseToggled)="toggleCollapsed()"
    />
  }

  <div class="shell__column">
    <header class="shell__topbar">
      @if (isDrawer()) {
        <button
          #navButton
          type="button"
          class="shell__icon-button"
          aria-haspopup="dialog"
          (click)="openDrawer()"
        >
          <i class="pi pi-bars" aria-hidden="true"></i>
          <span class="shell__hidden">Open navigation</span>
        </button>
        <p class="shell__wordmark"><span>Field</span><span class="shell__accent">Ops</span></p>
      } @else {
        <form class="shell__search" role="search" (submit)="onSearch($event)">
          <label class="shell__hidden" for="shell-search">Search</label>
          <p-iconfield>
            <p-inputicon class="pi pi-search" />
            <input
              pInputText
              id="shell-search"
              type="search"
              class="shell__search-input"
              fluid
              autocomplete="off"
              [placeholder]="searchPlaceholder"
            />
          </p-iconfield>
        </form>
      }

      <span class="shell__spacer"></span>

      @if (!isDrawer()) {
        <div
          #orgContainer
          class="shell__menu-wrap"
          (focusout)="onMenuFocusOut($event, orgContainer)"
        >
          <button
            #orgButton
            type="button"
            class="shell__org-button"
            aria-haspopup="menu"
            [attr.aria-expanded]="orgMenuOpen()"
            [attr.aria-label]="'Organization, ' + organizationName()"
            (click)="toggleMenu('org')"
            (keydown)="onButtonKeydown($event, 'org')"
          >
            <i class="pi pi-building" aria-hidden="true"></i>
            <span class="shell__org-name" aria-hidden="true">{{ organizationName() }}</span>
            <i class="pi pi-chevron-down shell__chevron" aria-hidden="true"></i>
          </button>

          @if (orgMenuOpen()) {
            <div class="shell__menu" role="menu" aria-label="Organization">
              <button
                type="button"
                role="menuitem"
                class="shell__menu-item"
                aria-current="true"
                (click)="selectOrganization()"
                (keydown)="onMenuKeydown($event)"
              >
                <i class="pi pi-building" aria-hidden="true"></i>
                <span class="shell__menu-text">{{ organizationName() }}</span>
                <span class="shell__menu-current">
                  <i class="pi pi-check" aria-hidden="true"></i>Current
                </span>
              </button>
            </div>
          }
        </div>

        <a class="shell__icon-button" [routerLink]="helpLink" aria-label="Help">
          <i class="pi pi-question-circle" aria-hidden="true"></i>
        </a>
      }

      <a class="shell__icon-button" [routerLink]="notificationsLink" aria-label="Notifications">
        <i class="pi pi-bell" aria-hidden="true"></i>
      </a>

      <div
        #userContainer
        class="shell__menu-wrap shell__user"
        (focusout)="onMenuFocusOut($event, userContainer)"
      >
        <button
          #userButton
          type="button"
          class="shell__user-button"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="accountLabel()"
          (click)="toggleMenu('user')"
          (keydown)="onButtonKeydown($event, 'user')"
        >
          <span class="shell__initials" aria-hidden="true">{{ initials() }}</span>
          <span class="shell__identity" aria-hidden="true">
            <span class="shell__name">{{ fullName() }}</span>
            <span class="shell__role">{{ session()?.role.name }}</span>
          </span>
          <i class="pi pi-chevron-down shell__chevron shell__identity" aria-hidden="true"></i>
        </button>

        @if (menuOpen()) {
          <div class="shell__menu" role="menu" aria-label="Account">
            <button
              type="button"
              role="menuitem"
              class="shell__menu-item"
              [attr.aria-disabled]="signingOut()"
              (click)="signOut()"
              (keydown)="onMenuKeydown($event)"
            >
              @if (signingOut()) {
                <svg data-p-icon="spinner" [spin]="true" aria-hidden="true"></svg>
              }
              Sign out
            </button>
          </div>
        }
      </div>
    </header>

    @if (signOutFailed()) {
      <p-message class="shell__alert" severity="error">{{ signOutErrorMessage }}</p-message>
    }

    <main class="shell__main">
      <router-outlet />
    </main>
  </div>

  @if (isDrawer()) {
    <p-drawer
      pFocusTrap
      [pFocusTrapDisabled]="!drawerOpen()"
      position="left"
      [visible]="drawerOpen()"
      (visibleChange)="drawerOpen.set($event)"
      (onHide)="onDrawerHide()"
      [modal]="true"
      [showCloseIcon]="false"
      [style]="drawerStyle"
      [pt]="drawerPt"
    >
      <ng-template #header></ng-template>
      <app-shell-sidebar
        [groups]="groups()"
        [drawer]="true"
        (navigated)="closeDrawer()"
        (closeRequested)="closeDrawer()"
      />
    </p-drawer>
  }
</div>
